# ==========================================================================
# You can monitor as many URLs as you want. Each one gets its own
# [site:somename] section — "somename" can be anything (no spaces),
# it's just a label used internally and in log lines.
#
# If a URL requires login, add a matching [login:somename] section and
# reference it from the site with `login = somename`. Different sites
# can point to the same login section (shared login, logged in once
# per run) or to different login sections (separate logins), or have
# no `login` line at all (public page, no login needed).
# ==========================================================================

[email]
# Shared by all sites — SMTP settings for sending alert emails.
# Example below is for Gmail. You MUST use an "App Password", not your
# normal password: https://myaccount.google.com/apppasswords
smtp_host = smtp.gmail.com
smtp_port = 587
smtp_username = your_email@gmail.com
smtp_password = your_16_char_app_password
from_address = your_email@gmail.com
to_address = where_you_want_alerts@example.com


# --------------------------------------------------------------------
# EXAMPLE 1: a public page, no login needed
# --------------------------------------------------------------------
[site:public_contact_form]
site_name = Company Contact Form
url = https://example.com/contact
expected_status = 200
expected_text = name="contact-form"
forbidden_text =
timeout_seconds = 15


# --------------------------------------------------------------------
# EXAMPLE 2: a page behind login A
# --------------------------------------------------------------------
[site:itinerary_client_1]
site_name = Client 1 Itinerary
url = "https://example.com/itinerary/details/abc123,"
expected_status = 200
expected_text = Itinerary Details
forbidden_text =
timeout_seconds = 15
login = client1_login

[login:client1_login]
login_url = https://example.com/Account/LogOn
username = client1_username
password = client1_password
# The "name" attribute of the login form's username/password fields.
# Find these via View Page Source (Ctrl+U) on the login page.
username_field = UserName
password_field = Password
# Hidden anti-forgery/CSRF token field, common on ASP.NET sites.
# The script auto-detects and submits it if present — usually no need
# to change this default.
csrf_field = __RequestVerificationToken


# --------------------------------------------------------------------
# EXAMPLE 3: a page behind a DIFFERENT login B
# --------------------------------------------------------------------
[site:itinerary_client_2]
site_name = Client 2 Itinerary
url = "https://another-example.com/itinerary/details/xyz789,"
expected_status = 200
expected_text = Itinerary Details
forbidden_text =
timeout_seconds = 15
login = client2_login

[login:client2_login]
login_url = https://another-example.com/Account/LogOn
username = client2_username
password = client2_password
username_field = UserName
password_field = Password
csrf_field = __RequestVerificationToken


# --------------------------------------------------------------------
# Add as many more [site:name] (and matching [login:name] if needed)
# sections as you like. Copy one of the examples above as a starting
# point for each new URL.
# --------------------------------------------------------------------
